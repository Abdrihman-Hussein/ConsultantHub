<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320" role="img" aria-label="Illustrated portrait">
  <defs>
    <radialGradient id="bg" cx="50%" cy="36%" r="74%">
      <stop offset="0%" stop-color="#FAF3EA"/>
      <stop offset="100%" stop-color="#EADCCB"/>
    </radialGradient>
    <clipPath id="face">
      <ellipse cx="160" cy="132" rx="52" ry="60"/>
    </clipPath>
  </defs>

  <rect width="320" height="320" fill="url(#bg)"/>

  <!-- charcoal shirt -->
  <path d="M20 320C20 254 78 218 160 218s140 36 140 102Z" fill="#33302E"/>
  <path d="M126 220c10 40 58 40 68 0l22 8c-14 60-98 60-112 0Z" fill="#282523"/>
  <circle cx="160" cy="258" r="4" fill="#5A5451"/>
  <circle cx="160" cy="288" r="4" fill="#5A5451"/>

  <!-- neck -->
  <rect x="139" y="168" width="42" height="70" rx="19" fill="#9E6B45"/>

  <!-- ears -->
  <ellipse cx="108" cy="140" rx="11" ry="14" fill="#B07C52"/>
  <ellipse cx="212" cy="140" rx="11" ry="14" fill="#B07C52"/>

  <!-- head -->
  <ellipse cx="160" cy="132" rx="52" ry="60" fill="#B07C52"/>

  <!-- shaved head, with a soft sheen -->
  <path d="M126 92c10-12 22-18 34-18s24 6 34 18c-9-6-21-9-34-9s-25 3-34 9Z" fill="#FFFFFF" opacity=".22"/>
  <path d="M114 122c4-32 22-50 46-50s42 18 46 50c-6-30-22-44-46-44s-40 14-46 44Z" fill="#2A1E16" opacity=".18"/>

  <!-- goatee -->
  <g clip-path="url(#face)">
    <path d="M142 176c4 22 10 30 18 30s14-8 18-30c-6 6-12 8-18 8s-12-2-18-8Z" fill="#2A1E16"/>
    <path d="M136 158c10-7 38-7 48 0-10 8-38 8-48 0Z" fill="#2A1E16"/>
  </g>

  <!-- brows -->
  <path d="M125 120c9-7 23-7 30-1" fill="none" stroke="#2A1E16" stroke-width="5.5" stroke-linecap="round"/>
  <path d="M195 120c-9-7-23-7-30-1" fill="none" stroke="#2A1E16" stroke-width="5.5" stroke-linecap="round"/>

  <!-- eyes -->
  <ellipse cx="140" cy="133" rx="7" ry="5.6" fill="#241C16"/>
  <ellipse cx="180" cy="133" rx="7" ry="5.6" fill="#241C16"/>
  <circle cx="142" cy="131" r="2" fill="#fff" opacity=".9"/>
  <circle cx="182" cy="131" r="2" fill="#fff" opacity=".9"/>

  <!-- nose and mouth -->
  <path d="M160 140l-5 20q5 5 12-1" fill="none" stroke="#8E6039" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M148 172c6 6 18 6 24 0" fill="none" stroke="#96564A" stroke-width="4" stroke-linecap="round"/>
</svg>